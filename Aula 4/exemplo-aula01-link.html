<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de link e imagem</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            margin: 0;
            background-color: #1f2a37;
            font-family: Arial, sans-serif;
            color: #f1f5f9;
        }
        .imagem img {
            margin-bottom: 20px;
            border-radius: 20px;
        }
        a { color: #7dd3fc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exemplo de link e imagem</h1>
        <div class="imagem">
            <img src="https://picsum.photos/seed/aula4/640/360" alt="Imagem de exemplo" width="640" height="360">
        </div>
        <h3>Imagem aleatória do Picsum</h3>
        <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML/Element/a" target="_blank" rel="noopener noreferrer">
            Clique aqui para ler sobre a tag &lt;a&gt; na MDN
        </a>
    </div>
</body>
</html>
