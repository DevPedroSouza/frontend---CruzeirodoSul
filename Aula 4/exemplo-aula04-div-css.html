<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div com CSS</title>
    <style>
        body {
            background-color: #f3e9d2;
            font-family: Arial, sans-serif;
        }
        #principal, #secundaria {
            font-size: 28px;
            text-align: center;
            color: #1c1917;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border: 2px solid #ffffff;
        }
        #principal {
            font-style: oblique;
            background-color: #a7d7a9;
        }
        #secundaria {
            font-style: italic;
            background-color: #9fd8e6;
        }
    </style>
</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="secundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
