<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo CSS interno</title>
    <style>
        body {
            background-color: #e5e9e6;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 { font-size: 40px; color: #1f2a37; }
        h2 { font-size: 28px; color: #1f2a37; }
        a.link {
            color: #1f2a37;
            text-decoration: none;
            font-weight: bold;
        }
        a.link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main>
        <h1>Aprendendo CSS interno</h1>
        <section>
            <h2>Página com estilização</h2>
            <p>Esta é uma página simples com o CSS escrito dentro da tag &lt;style&gt;.</p>
            <p>Diferente do CSS externo, aqui o estilo fica no mesmo arquivo HTML.</p>
            <a class="link" href="https://developer.mozilla.org/pt-BR/docs/Web/CSS" target="_blank" rel="noopener noreferrer">
                Saiba mais sobre CSS
            </a>
        </section>
        <footer>
            <p>&copy; Pedro</p>
        </footer>
    </main>
</body>
</html>
