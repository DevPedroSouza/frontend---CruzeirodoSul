<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classes com CSS</title>

    <style>
        .titulo{
            color: blue;
            text-align: center;
        }
        .caixa01{
            background-color: aliceblue;
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }
        .caixa02{
            background-color: lightblue;
            border: 2px solid darkgreen;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1 class="titulo" style="color: blue; text-align: center;">
        Classes com CSS
    </h1>

    <div class="primeira-div">
        <p style="color: red;">
            Este é o primeiro parágrafo da primeira div.
        </p>

        <p style="color: green;">
            Este é o segundo parágrafo da primeira div.
        </p>
    </div>

    <div class="segunda-div">
        <p style="color: purple;">
            Este é o único parágrafo da segunda div.
        </p>
    </div>

</body>
</html>
