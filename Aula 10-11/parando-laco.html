<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parando o laço</title>
    <script>
        let soma = 0;
        while (true) {
            const num = Number(prompt("Digite um número (vazio ou 0 para sair)", ""));
            if (!num) break;
            soma += num;
        }
        console.log(`Soma: ${soma}`);
    </script>
</head>
<body>
    <p>Abra o console (F12) para ver a soma.</p>
</body>
</html>
