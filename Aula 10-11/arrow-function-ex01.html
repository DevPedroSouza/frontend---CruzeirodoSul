<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function sem parâmetros</title>
    <script>
        const boasVindas = () => {
            return "Olá, obrigado por usar este app!";
        };
        const boasVindas2 = () => "Olá, obrigado por usar este app!"; // versão mais curta

        alert(boasVindas());
        alert(boasVindas2());
    </script>
</head>
<body>
    <h2>JavaScript: arrow function</h2>
    <p>Exemplo de arrow function (função de seta) sem parâmetros.</p>
</body>
</html>
