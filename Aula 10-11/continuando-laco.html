<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue no laço</title>
    <script>
        for (let i = 0; i < 10; i++) {
            if (i % 2 === 0) continue;
            console.log(i); // imprime só os ímpares de 0 a 9
        }
    </script>
</head>
<body>
    <p>Abra o console (F12) para ver os números ímpares.</p>
</body>
</html>
