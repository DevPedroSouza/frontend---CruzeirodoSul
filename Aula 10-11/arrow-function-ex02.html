<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function com parâmetros</title>
    <script>
        const media = (v1, v2, v3) => (v1 + v2 + v3) / 3;
        alert("Média de três valores: " + media(9, 4, 8));
    </script>
</head>
<body>
    <h2>JavaScript: arrow function</h2>
    <p>Exemplo de arrow function (função de seta) com três parâmetros.</p>
</body>
</html>
