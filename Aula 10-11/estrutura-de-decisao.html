<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de decisão</title>
    <script>
        const hora = new Date().getHours();
        const previsaoTempo = "chuvoso";

        if (hora < 12) {
            alert("Bom dia...");
            if (previsaoTempo === "chuvoso") {
                alert("Está chovendo, leve o guarda-chuva");
            }
        } else if (hora < 18) {
            alert("Boa tarde...");
        } else {
            alert("Boa noite...");
        }
    </script>
</head>
<body>
    <p>Exemplo de if / else if / else com a hora atual.</p>
</body>
</html>
